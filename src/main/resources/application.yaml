spring:
  application:
    name: teamup-platform

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/teamup}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD}

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  sql:
    init:
      mode: never

server:
  port: 8080

file:
  upload-dir: uploads
