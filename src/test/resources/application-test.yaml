spring:
  datasource:
    url: jdbc:h2:mem:teamup-test;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password:

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: create-drop
    show-sql: false

  flyway:
    enabled: false

  sql:
    init:
      mode: never

app:
  jwt:
    secret: test-only-jwt-secret-key-that-is-long-enough-123456
